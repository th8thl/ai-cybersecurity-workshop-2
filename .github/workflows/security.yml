name: Workshop security checks
on: [push, pull_request]
jobs:
  solution:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-disposable-secret-key-not-a-deployment-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: solution/requirements.txt
      - run: python -m pip install -r solution/requirements.txt
      - name: Unit and authorization tests
        working-directory: solution
        run: python manage.py test
      - name: Real MCP and NeMo deterministic integration
        working-directory: solution
        run: python scripts/healthcheck.py
      - name: Configured NeMo rules
        working-directory: solution
        run: python guardrails/compare.py --configured
      - name: Scan the starter application boundaries
        working-directory: starter
        run: python scripts/verify_sast.py
      - name: Check repaired ticket application
        working-directory: solution
        run: python scripts/verify_sast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            starter/results/
            solution/results/
