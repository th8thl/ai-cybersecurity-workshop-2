<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 535" role="img" aria-labelledby="system-title system-desc" style="display:block;width:100%;height:auto"><title id="system-title">Ticket application, browser and optional assistant</title><desc id="system-desc">Ticket forms, chat interface and consent screen are inside the user's browser. Forms call the core ticket application directly. The optional chatbot checks model proposals with NeMo and calls MCP over stdio. MCP validates delegated grants and supplies the actor to the core ticket service. Consent stores token hashes and scopes in the database; the raw token is held in a browser cookie and passed through the MCP child environment. All request paths converge on schema, ownership and human-confirmation checks in the ticket application.</desc><defs><marker id="map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#147d92"/></marker></defs><style>.map-title{font:700 21px 'Segoe UI',Arial;fill:#17212b}.map-text{font:18px 'Segoe UI',Arial;fill:#17212b}.map-small{font:16px 'Segoe UI',Arial;fill:#596a76}.map-label{font:700 16px 'Segoe UI',Arial;fill:#075f71}.map-edge{fill:none;stroke:#147d92;stroke-width:2.5;marker-end:url(#map-arrow)}</style><rect x="10" y="55" width="230" height="465" rx="12" fill="#e6eee9" stroke="#596a76" stroke-width="2"/><text x="26" y="85" class="map-title">User’s browser</text><rect x="25" y="108" width="200" height="95" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="40" y="137" class="map-title">Ticket forms</text><text x="40" y="165" class="map-text">Create / read / close</text><text x="40" y="188" class="map-text">Session cookie</text><rect x="25" y="263" width="200" height="95" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="40" y="292" class="map-title">Chat interface</text><text x="40" y="320" class="map-text">User messages</text><text x="40" y="343" class="map-text">Session cookie</text><rect x="25" y="418" width="200" height="85" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="40" y="447" class="map-title">Consent screen</text><text x="40" y="475" class="map-text">HttpOnly MCP cookie</text><rect x="965" y="205" width="325" height="160" rx="12" fill="#e0efe9" stroke="#147d92" stroke-width="3"/><text x="980" y="234" class="map-title">Ticket application · CORE</text><text x="980" y="262" class="map-text">tickets/ticket_service.py</text><text x="980" y="285" class="map-text">Validate request schema</text><text x="980" y="308" class="map-text">Enforce ticket ownership</text><text x="980" y="331" class="map-text">Require human confirmation</text><rect x="300" y="205" width="270" height="160" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="315" y="234" class="map-title">Chatbot · Django</text><text x="315" y="262" class="map-text">Model proposes; code plans</text><text x="315" y="285" class="map-text">NeMo: input, proposal,</text><text x="315" y="308" class="map-text">result and output checks</text><text x="315" y="331" class="map-text">App / provider keys: .env</text><rect x="650" y="225" width="235" height="140" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="665" y="254" class="map-title">MCP server · stdio</text><text x="665" y="282" class="map-text">Validate token + scope</text><text x="665" y="305" class="map-text">Derive actor from grant</text><text x="665" y="328" class="map-text">Raw token: child env</text><rect x="300" y="55" width="270" height="100" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="315" y="84" class="map-title">Model provider</text><text x="315" y="112" class="map-text">Qwen local / Gemini cloud</text><text x="315" y="135" class="map-text">Sanitized context only</text><rect x="650" y="400" width="235" height="120" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="665" y="429" class="map-title">Consent · Django</text><text x="665" y="457" class="map-text">DB: hash, user, client</text><text x="665" y="480" class="map-text">Audience, scopes, expiry</text><text x="665" y="503" class="map-text">Revocation state</text><rect x="965" y="418" width="325" height="102" rx="12" fill="#fffdf7" stroke="#9aacae" stroke-width="1.5"/><text x="980" y="447" class="map-title">Application database</text><text x="980" y="475" class="map-text">Tickets, users, approvals,</text><text x="980" y="498" class="map-text">conversations and audit records</text><path d="M225 145H260V25H1127V205" class="map-edge"/><text x="430" y="16" class="map-label">1 · Ticket forms → Django routes · login + CSRF</text><path d="M225 300H300" class="map-edge"/><text x="239" y="286" class="map-label">2 · Chat</text><path d="M570 290H650" class="map-edge"/><text x="587" y="275" class="map-label">stdio</text><path d="M885 290H965" class="map-edge"/><text x="904" y="275" class="map-label">actor</text><path d="M435 205V155" class="map-edge" marker-start="url(#map-arrow)"/><text x="452" y="181" class="map-label">Untrusted proposal / context</text><path d="M225 460H650" class="map-edge" marker-start="url(#map-arrow)"/><text x="292" y="445" class="map-label">3 · Consent / raw token cookie</text><path d="M767 400V365" class="map-edge"/><text x="782" y="389" class="map-label">Grant lookup</text><path d="M1127 365V418" class="map-edge"/><text x="1142" y="399" class="map-label">Persist</text></svg>