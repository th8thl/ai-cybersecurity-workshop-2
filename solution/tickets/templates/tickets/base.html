<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ portal.title }}</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#173042;background:#f2f5f8;font-size:16px}*{box-sizing:border-box}body{margin:0}a{color:#075b85}header{background:#fff;border-bottom:1px solid #dbe4ea;padding:18px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:750;font-size:19px;text-decoration:none;color:#163548}.brand small{display:block;font-weight:400;font-size:13px;color:#5c6d78;margin-top:3px}.account{display:flex;align-items:center;gap:14px;font-size:14px}main{max-width:1180px;margin:30px auto;padding:0 24px}h1{font-size:30px;margin:0 0 10px}h2{font-size:18px;margin:0 0 15px}p{line-height:1.55}.muted{color:#5e707c}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.panel{background:#fff;border:1px solid #dbe4ea;border-radius:14px;overflow:hidden}.panel-head{padding:20px;border-bottom:1px solid #e8eef2}.conversation{min-height:300px;max-height:520px;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}.bubble{padding:13px 17px;border-radius:12px;max-width:88%;line-height:1.55;white-space:pre-wrap}.assistant{align-self:flex-start;background:#f0f4f7}.user{align-self:flex-end;background:#145f7e;color:#fff}.role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px;opacity:.75}.composer{border-top:1px solid #e4ebef;padding:20px}.compose-row{display:flex;gap:10px;align-items:flex-end}textarea,input,select,button{font:inherit}textarea{width:100%;padding:12px;border:1px solid #a8b9c5;border-radius:8px;resize:vertical;min-height:75px}button,.button{cursor:pointer;background:#145f7e;color:#fff;border:0;border-radius:8px;padding:11px 17px;font-weight:600;text-decoration:none;display:inline-block}button:hover,.button:hover{background:#104a63}.secondary{background:#eaf0f4;color:#234353}.secondary:hover{background:#dce6ec}.quiet{background:none;color:#365665;padding:6px;font-weight:400}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.examples button{font-size:13px;padding:8px 10px}.provider{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:#5e707c}select{padding:6px;border:1px solid #bdcbd4;border-radius:5px;background:white}.sidebar .panel{margin-bottom:18px}.ticket-link{display:block;padding:17px 20px;border-top:1px solid #e4ebef;text-decoration:none;color:#1c3d52}.ticket-link:hover{background:#edf5fa}.ticket-link strong{display:block;font-size:15px;line-height:1.5}.ticket-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#647784}.status{background:#e7f3eb;color:#27613c;padding:2px 8px;border-radius:20px}.status.closed{background:#eef0f2;color:#59636b}.empty{padding:0 20px 20px;color:#697e8b;font-size:14px}.confirmation{margin:16px 20px;padding:16px;border:1px solid #c7dccf;background:#f4faf6;border-radius:9px}.confirmation p{margin:0 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.workshop{margin-top:24px}.workshop>summary{cursor:pointer;padding:18px 22px;font-weight:600;color:#526a79}.inspection{padding:0 22px 22px}.inspection p{font-size:14px}.inspection pre{background:#edf2f6;padding:14px;overflow:auto;font-size:12px;white-space:pre-wrap}.inspection textarea{font:13px ui-monospace,monospace}.audit{font-size:12px;padding:8px 0;border-top:1px solid #e5ebf0}.detail{max-width:720px;margin:30px auto}.detail-body{padding:28px}.detail h1{font-size:26px}.notice{font-size:13px;background:#eef4f8;padding:12px 15px;border-radius:8px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){.workspace{grid-template-columns:1fr}.account span{display:none}main{padding:0 14px;margin:20px auto}.compose-row{flex-direction:column;align-items:stretch}.conversation{max-height:440px}.bubble{max-width:96%}}
[hidden]{display:none!important}dialog{max-width:90vw;width:1000px;max-height:85vh;border:1px solid #bdcbd4;border-radius:12px}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere}.typing{animation:pulse 1s infinite alternate}@keyframes pulse{from{opacity:.45}to{opacity:1}}#request-status{min-height:1.5em}
.bubble.error{background:#fff0ef;border:1px solid #c9493f;color:#7e2018;align-self:flex-start}nav{display:flex;gap:20px}nav a{font-weight:600;text-decoration:none}.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.detail input[type=text]{width:100%;padding:12px;border:1px solid #a8b9c5;border-radius:8px}.helptext{display:block;font-size:13px;color:#5e707c;margin-top:7px}.errorlist,.application-error{color:#8b2119}.application-error{background:#fff0ef;padding:15px;border-radius:8px}@media(max-width:600px){header{flex-wrap:wrap}.page-head{align-items:flex-start}.account{margin-left:auto}}</style></head><body><header><a class="brand" href="{% url 'ticket_list' %}">{{ portal.title }}<span><small>{{ portal.subtitle }}</small></span></a>{% if request.user.is_authenticated %}<nav aria-label="Main navigation"><a href="{% url 'ticket_list' %}">Tickets</a><a href="{% url 'assistant' %}">Assistant</a></nav><div class="account"><span>{{ request.user.username|title }}</span><form method="post" action="/accounts/logout/">{% csrf_token %}<button class="quiet">Sign out</button></form></div>{% endif %}</header><main>{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
