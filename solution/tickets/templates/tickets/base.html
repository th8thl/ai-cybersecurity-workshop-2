/* Compact portal chrome and assistant workspace. */
header{padding:8px max(20px,calc((100vw - 1320px)/2));gap:16px;min-height:52px}
.brand{font-size:16px;line-height:1.2}.brand small{font-size:11px;margin-top:2px}.account{gap:10px}nav{gap:16px;font-size:14px}
main{max-width:1320px;margin:14px auto;padding:0 20px}.chat-workspace{grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}

.chat-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 12px}.chat-head h2{margin:0;font-size:17px}.chat-head .provider{margin:0;gap:6px;font-size:12px}.chat-head select{font-size:12px;padding:5px}.chat-head .examples{margin:0;gap:5px}.chat-head .examples button{font-size:12px;padding:6px 8px}.debug-toggle{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.chat-panel .conversation{flex:1;min-height:160px;max-height:none;padding:14px;gap:10px}.bubble{padding:10px 12px;line-height:1.45}.chat-panel .composer{padding:10px 12px}.chat-panel textarea{min-height:60px;height:60px;max-height:180px;padding:9px}.compose-row{gap:8px}.compose-row button{padding:10px 14px;white-space:nowrap;flex-shrink:0}.composer-meta{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:11px;color:#5e707c}#request-status{min-height:0}#request-status:empty{display:none}#confirmations .notice{margin:6px 12px;padding:8px 10px}
.debug-panel{max-height:calc(100dvh - 86px);overflow:auto;font-size:13px}.debug-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e4ebef}.debug-head h2{font-size:16px;margin:0}.debug-head span{font-size:12px}.debug-section{padding:10px 12px;border-bottom:1px solid #e4ebef}.debug-section h3{font-size:14px;margin:0 0 6px}.debug-section p{margin:5px 0;line-height:1.4}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-heading h3{margin:0}.section-heading a{font-size:12px}.debug-panel .ticket-link{padding:8px 0}.debug-panel .ticket-link:first-of-type{margin-top:5px}.debug-panel .ticket-link strong{font-size:13px;line-height:1.3}.debug-panel .ticket-meta{margin-top:3px;font-size:11px}.debug-panel .status{padding:1px 6px}.debug-panel .inspection{padding:0}.debug-section summary{cursor:pointer;font-size:13px;font-weight:600}.debug-section[open] summary{margin-bottom:8px}.debug-panel .inspection pre{max-height:210px;margin:8px 0 0;padding:9px;font-size:11px;overflow-wrap:anywhere}.debug-panel .inspection textarea{min-height:72px;margin:6px 0;font-size:12px}.debug-panel button{font-size:12px;padding:7px 10px}.debug-panel form label{display:block;font-weight:600}.debug-panel dialog{font-size:14px}.debug-panel dialog pre{max-height:none}
@media(max-width:950px){.chat-workspace{grid-template-columns:minmax(0,1fr) 320px}.chat-head .examples{width:100%;order:4}.chat-head .debug-toggle{margin-left:auto}}
@media(max-width:760px){header{padding:8px 14px;gap:8px;flex-wrap:wrap}.brand small{display:none}nav{gap:12px;font-size:13px}.account span{display:none}main{padding:0 10px;margin:10px auto}.chat-workspace{grid-template-columns:1fr;gap:10px}.chat-panel{height:70dvh;min-height:410px}.debug-panel{max-height:none}.composer-meta{flex-direction:column;gap:2px}.compose-row{flex-direction:row;align-items:flex-end}.chat-head .examples{width:auto;order:initial}.debug-toggle{margin-left:auto}}
.bubble.safe-response{background:#e5f5e9;border:1px solid #86b895;color:#205b34}
</style></head><body><header><a class="brand" href="{% url 'ticket_list' %}">{{ portal.title }}<span><small>{{ portal.subtitle }}</small></span></a>{% if request.user.is_authenticated %}<nav aria-label="Main navigation"><a href="{% url 'ticket_list' %}">Tickets</a><a href="{% url 'assistant' %}">Assistant</a><a href="{% url 'assistant_authorization' %}">Authorization</a></nav><div class="account"><span>{{ request.user.username|title }}</span><form method="post" action="/accounts/logout/">{% csrf_token %}<button class="quiet">Sign out</button></form></div>{% endif %}</header><main>{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
