rules:
  - id: workshop-model-selected-dispatch
    languages: [python]
    severity: WARNING
    message: Unchecked model-selected dispatch. Verify schema, authorization and approval.
    pattern: dispatch($PROPOSAL["tool"], ..., $ACTOR)
    metadata:
      cwe: CWE-862
  - id: workshop-shell-command
    languages: [python]
    severity: ERROR
    message: Shell command construction allows command injection; use an argument list and validate inputs.
    pattern: subprocess.check_output(..., shell=True, ...)
    metadata:
      cwe: CWE-78
